<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <!-- Mobile App Meta Tags -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#004C45">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ISD RCP">
  
  <title>ISD Reference Checking System</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  
  <!-- App Icons (You will need to upload these images to GitHub) -->
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  
  <script src="script.js" defer></script>
</head>
<body>

  <div id="loginScreen" class="login-container">
    <div class="login-box">
      <div class="login-header">
        <img id="loginLogo" src="" alt="ISD Logo" style="max-height: 90px; display: none; margin: 0 auto 15px auto;">
        <h2>ISD Reference Checking System</h2>
        <p>Please log in to continue</p>
      </div>
      <form id="loginForm" onsubmit="handleLogin(event)">
        <div class="input-group"><label>Username</label><input type="text" id="username" required></div>
        <div class="input-group"><label>Password</label><input type="password" id="password" required></div>
        
        <!-- Custom Math Captcha -->
        <div class="input-group" style="background:#f9f9f9; padding:10px; border-radius:5px; border:1px solid #eee;">
          <label style="color:var(--isd-teal);"><strong>Security Check</strong></label>
          <div style="display:flex; align-items:center; gap:10px; margin-top:5px;">
            <span id="captchaQuestion" style="font-weight:bold; font-size:16px; min-width:60px;"></span>
            <input type="number" id="captchaInput" required placeholder="Answer" style="flex:1;">
          </div>
          <small id="captchaError" style="color:red; display:none; margin-top:5px;">Incorrect answer. Please try again.</small>
        </div>

        <button type="submit" id="loginBtn" class="btn btn-primary">Login</button>
        <div style="margin-top:15px; text-align:center;">
          <a href="javascript:void(0);" onclick="forgotPassword()" style="color:var(--isd-teal); font-size:13px; text-decoration:none;">Forgot Password?</a>
        </div>
      </form>
    </div>
  </div>

  <div id="mainApp" class="app-container" style="display: none;">
    <nav class="sidebar">
      <div class="sidebar-brand">Menu</div>
      <a href="javascript:void(0);" id="nav-dashboard" onclick="showModule('dashboard', this, event)">Dashboard</a>
      <a href="javascript:void(0);" id="nav-sendEmail" onclick="showModule('sendEmail', this, event)">Send Reference</a>
      <a href="javascript:void(0);" id="nav-form" onclick="showModule('form', this, event)">Manage Referees</a>
      <a href="javascript:void(0);" id="nav-admin" style="display:none;" onclick="showModule('admin', this, event)">Admin Settings</a>
      <a href="javascript:void(0);" onclick="logout(event)" class="logout-btn">Logout</a>
    </nav>

    <main class="main-content">
      <header class="top-header">
        <div class="header-left">
          <img id="headerLogo" src="" alt="ISD Logo" style="max-height: 50px; display: none;">
          <h1>International School Dhaka</h1>
        </div>
        <div class="header-right"><span id="userNameDisplay"></span></div>
      </header>
      <div id="contentArea" class="content-area"></div>
    </main>
  </div>

  <div id="customModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <div class="modal-header" id="modalTitle">Alert</div>
      <div class="modal-body" id="modalMessage">Message goes here.</div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="closeModal()">OK</button>
      </div>
    </div>
  </div>

</body>
</html>
